# ============================================================================
# Dependency Mapper - AI Tool Integration Configuration
# ============================================================================
# Copy this file to config.yaml and customize for your environment
#
# Usage:
#   cp config.example.yaml config.yaml
#   # Edit config.yaml with your settings
#
# Note: config.yaml is gitignored - safe to store local paths/preferences
# ============================================================================

# AI Tool Prompts
# ============================================================================
claudePrompt: |
  You are analyzing a C# .NET project with architectural smells.
  Please propose a refactoring solution that:
  - Addresses the specific smell identified
  - Maintains existing functionality
  - Follows SOLID principles and .NET best practices
  - Considers the broader architectural context

# WSL Tools Configuration
# ============================================================================
# Master toggle for OpenCode and GitHub Copilot
# Does NOT affect Claude Code (see claudeCodeUseWsl below)
enableWslTools: false

# WSL distribution name (check with: wsl -l -v)
wslDistro: Ubuntu-24.04

# WSL path prefix (usually \\wsl.localhost\<distro> or \\wsl$\<distro>)
wslPathPrefix: \\wsl.localhost\\Ubuntu-24.04

# Claude Code Configuration
# ============================================================================
# Separate toggle for Claude Code execution mode
# true  = Run Claude Code via WSL (with optional micromamba)
# false = Run Claude Code on Windows native (default)
#
# This is independent of enableWslTools, allowing you to:
#   - Use Windows Claude Code + WSL OpenCode/Copilot
#   - Use WSL Claude Code + Windows-only setup
claudeCodeUseWsl: false

# Path to Claude Code executable
# - If claudeCodeUseWsl=false: Windows PATH (e.g., "claude" finds claude.exe)
# - If claudeCodeUseWsl=true: WSL path (e.g., "/home/user/.local/bin/claude")
# Examples:
#   - "claude"                              (from PATH - Windows or WSL)
#   - "/home/username/.local/bin/claude"    (WSL absolute path)
#   - "~/.local/bin/claude"                 (WSL home-relative)
claudeCodePath: claude

# Micromamba/Conda environment to activate before running Claude Code
# Only applies when claudeCodeUseWsl=true
# Leave empty ("") to run in base environment
# Examples:
#   - ""            (no environment activation)
#   - "ai-tools"    (activate ai-tools environment)
#   - "python311"   (activate python311 environment)
micromambaEnv: ""

# OpenCode Configuration (https://opencode.ai)
# ============================================================================
# Path to OpenCode executable (in WSL or native Linux)
# OpenCode is a Go-based AI coding agent with a TUI
# Install: see https://opencode.ai/docs/
# Examples:
#   - "opencode"              (if in PATH)
#   - "/usr/local/bin/opencode"
#   - "~/.local/bin/opencode"
openCodePath: opencode

# Launch mode for OpenCode
# false = TUI mode (opens interactive terminal UI) - default
# true  = Non-interactive mode (uses opencode -p "<prompt>")
openCodeNonInteractive: false

# GitHub Copilot CLI Configuration
# ============================================================================
# Enable GitHub Copilot CLI integration
# Requires an active GitHub Copilot subscription (Pro, Pro+, Business, Enterprise)
githubCopilotEnabled: true

# Copilot CLI mode:
#   "standalone"    = New standalone CLI (npm i -g @github/copilot) - recommended
#   "gh-extension"  = Legacy gh copilot extension (deprecated Oct 2025)
copilotMode: standalone

# Path to the standalone Copilot CLI executable
# Only used when copilotMode: standalone
# Install: npm install -g @github/copilot
# Examples:
#   - "copilot"                       (if in PATH)
#   - "/home/user/.npm-global/bin/copilot"
copilotCliPath: copilot

# Fix Workflow Configuration
# ============================================================================
# The fix workflow enables a full lifecycle: click Fix in the viewer ->
# checkout code -> create branch -> AI fixes -> developer reviews ->
# run tests -> submit for review (SVN patch or Git PR).

# Version control system: "svn" or "git"
vcsType: svn

# Repository URL (SVN trunk URL or Git clone URL)
# Examples:
#   - "https://svn.example.com/repos/project/trunk"   (SVN)
#   - "git@github.com:org/repo.git"                    (Git)
repoUrl: ""

# SVN branch base URL (only used when vcsType: svn)
# Fix branches are created under this path.
# Example: "https://svn.example.com/repos/project/branches"
svnBranchBase: ""

# Local root folder on the developer's machine where repos are checked out.
# The companion will checkout/clone into developerRoot/<repo-name>/
# Leave empty ("") to disable the fix workflow.
# Examples:
#   - "C:\\repos"              (Windows)
#   - "/home/user/repos"       (Linux/WSL)
developerRoot: ""

# Branch name prefix for fix branches
# A deterministic ID is appended based on the smell + file + line
fixBranchPrefix: "fix/smell-"

# Target branch for Git PRs (only used when vcsType: git)
prTargetBranch: main

# Command to run tests after a fix is applied
# Leave empty ("") to skip test execution
# Examples:
#   - "dotnet test"
#   - "dotnet test --no-build"
#   - "npm test"
testCommand: ""

# Automatically run tests when a fix is submitted
autoRunTests: true

# ============================================================================
# Configuration Examples
# ============================================================================
#
# Example 1: Windows-only setup (no WSL)
# ----------------------------------------
# enableWslTools: false
# claudeCodePath: claude  # Uses Windows claude.exe from PATH
#
# Example 2: WSL with all AI tools
# ----------------------------------------
# enableWslTools: true
# wslDistro: Ubuntu-24.04
# claudeCodePath: claude
# micromambaEnv: ""
# openCodePath: opencode
# openCodeNonInteractive: false
# githubCopilotEnabled: true
# copilotMode: standalone
# copilotCliPath: copilot
#
# Example 3: WSL with micromamba + legacy gh copilot
# ---------------------------------------------------
# enableWslTools: true
# wslDistro: Ubuntu
# claudeCodePath: /home/user/.local/bin/claude
# micromambaEnv: ai-tools
# githubCopilotEnabled: true
# copilotMode: gh-extension  # Uses deprecated gh copilot extension
#
# Example 4: Native Linux (companion runs inside WSL/Linux directly)
# -------------------------------------------------------------------
# enableWslTools: true  # Still needed to show buttons in viewer
# claudeCodeUseWsl: false
# claudeCodePath: claude
# openCodePath: opencode
# githubCopilotEnabled: true
# copilotMode: standalone
# copilotCliPath: copilot
# # When the companion agent runs on Linux natively, it auto-detects
# # the platform and runs tools directly without the wsl -d wrapper.
#
# Example 5: Full fix workflow with SVN
# ----------------------------------------
# vcsType: svn
# repoUrl: "https://svn.example.com/repos/eShop/trunk"
# svnBranchBase: "https://svn.example.com/repos/eShop/branches"
# developerRoot: "C:\\repos"
# fixBranchPrefix: "fix/smell-"
# testCommand: "dotnet test"
# autoRunTests: true
#
# Example 6: Full fix workflow with Git/GitHub
# -----------------------------------------------
# vcsType: git
# repoUrl: "git@github.com:org/eShop.git"
# developerRoot: "/home/user/repos"
# prTargetBranch: main
# testCommand: "dotnet test"
# autoRunTests: true
#
# ============================================================================
